<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PIHTI{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ asset('favicon.svg') }}">
    <link rel="stylesheet" href="{{ asset('css/styles.css') }}">
    <script defer src="{{ asset('js/rails.js') }}"></script>
</head>

<body data-asset-version="{{ app_version }}">
    {% include 'navbar.html' %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <button class="drawer-backdrop" type="button" aria-label="Close side panel" hidden></button>
    {% block extra_js %}{% endblock %}
</body>

</html>
