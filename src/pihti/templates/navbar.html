<nav class="tabbar" aria-label="Main">
    <div class="tab-group">
        <a class="tab brand-tab" href="{{ url_for('home') }}">PIHTI <span class="tab-version" title="PIHTI release">v{{ app_version }}</span></a>
        <a class="tab" href="{{ url_for('home') }}" {% if active_nav == 'home' %}aria-current="page"{% endif %}>Vacuum</a>
        <a class="tab" href="{{ url_for('serve_history_view') }}" {% if active_nav == 'serve_history_view' %}aria-current="page"{% endif %}>History</a>
        <a class="tab" href="{{ url_for('plasmaplots') }}" {% if active_nav == 'plasmaplots' %}aria-current="page"{% endif %}>Plot</a>
        <a class="tab" href="{{ url_for('services') }}" {% if active_nav == 'services' %}aria-current="page"{% endif %}>Services</a>
    </div>
    <div class="tab-meta">
        {% if hostinfo is defined %}
        <span class="tab-host">{{ hostinfo.hostname_local }} · {{ hostinfo.ip }}</span>
        {% endif %}
        {% if operators %}
        <label class="operator-control">
            <span>Operator</span>
            <select id="operator-select" data-current="{{ session.get('username', '') }}" aria-label="Current operator">
                <option value="">Read only</option>
                {% for operator in operators %}
                <option value="{{ operator }}" {% if session.get('username') == operator %}selected{% endif %}>{{ operator }}</option>
                {% endfor %}
            </select>
        </label>
        {% else %}
        <a class="operator-missing" href="{{ url_for('identity_page') }}">No operators on this machine</a>
        {% endif %}
    </div>
</nav>
