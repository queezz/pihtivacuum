<!-- templates/navbar.html -->
<div class="navbar">
    <div class="navbar-container">
        <div class="navbar-logo">
            <a href="{{ url_for('home') }}">PIHTI</a>
            <span class="navbar-version" title="PIHTI release">v{{ app_version }}</span>
        </div>
        <button class="navbar-toggle" type="button" aria-label="Open navigation"
                aria-controls="navbarItems" aria-expanded="false">
            <span id="toggleIcon" aria-hidden="true">&#9776;</span>
        </button>
        <ul class="navbar-items" id="navbarItems">
            <li><a href="{{ url_for('home') }}">Vacuum</a></li>
            <li><a href="{{ url_for('serve_history_view') }}">History</a></li>
            <li><a href="{{ url_for('plasmaplots') }}">Plot</a></li>
        </ul>
        {% if hostinfo is defined %}
        <div class="navbar-hostinfo">
            {{ hostinfo.hostname_local }} · {{ hostinfo.ip }}
        </div>
        {% endif %}
        <div class="navbar-user">
            {% if session.get('username') %}
            <span>{{ session['username'] }}</span>
            <a href="{{ url_for('logout') }}" class="navbar-link">Logout</a>
            {% else %}
            <a href="{{ url_for('login_page') }}" class="navbar-link">Login</a>
            {% endif %}
        </div>
    </div>
</div>
